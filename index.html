<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master League S - 5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0c0e14; color: #ffffff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .match-card { background: #1a1c24; border-radius: 12px; padding: 16px 20px; border: 1px solid #2a2f3a; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .result-badge { font-size: 0.8rem; font-weight: 800; color: #d4ff00; }
        .team-link { font-size: 0.9rem; font-weight: 600; color: #f1f5f9; text-decoration: none; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .team-link:hover { color: #d4ff00; }
        .no-link { font-size: 0.9rem; font-weight: 600; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
        .nav-btn { font-size: 0.75rem; font-weight: 700; padding: 8px 12px; border-radius: 6px; background: #2a2f3a; color: #ffffff; transition: 0.3s; cursor: pointer; border: none; }
        .nav-btn.active { background: #d4ff00; color: #0c0e14; }
        #trophy-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: linear-gradient(135deg, #d4ff00, #a3c400); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(212, 255, 0, 0.4); z-index: 9999; font-size: 24px; }
    </style>
</head>
<body class="p-4 md:p-6">
    <div class="max-w-md mx-auto">
        <h1 class="text-xl font-bold text-white tracking-widest uppercase mb-6 text-center">Master League S - 5</h1>
        
        <div id="nav-container" class="flex flex-wrap gap-2 mb-8 justify-center">
            <button class="nav-btn active" onclick="showStage('R32', event)">Round of 32</button>
            <button class="nav-btn" onclick="showStage('R16', event)">Round of 16</button>
            <button class="nav-btn" onclick="showStage('QF', event)">Quarter Final</button>
            <button class="nav-btn" onclick="showStage('SF', event)">Semi</button>
            <button class="nav-btn" onclick="showStage('Final', event)">Final</button>
        </div>

        <div id="tournament-content" class="space-y-3"></div>
    </div>
    <a href="https://shelbyzio.github.io/MasterLeague_Fixtures/" id="trophy-btn">🏆</a>

    <script>
        const TEAMS = {
            "Côte d'Ivoire": "🇨🇮", "Egypt": "🇪🇬", "Senegal": "🇸🇳", "Brazil": "🇧🇷",
            "South Africa": "🇿🇦", "Japan": "🇯🇵", "Colombia": "🇨🇴", "Saudi Arabia": "🇸🇦",
            "England": "🏴󠁧󠁢󠁥󠁮󠁧󠁿", "Canada": "🇨🇦", "United States": "🇺🇸", "Iraq": "🇮🇶",
            "Mexico": "🇲🇽", "Belgium": "🇧🇪", "France": "🇫🇷", "Ghana": "🇬🇭",
            "Uruguay": "🇺🇾", "Morocco": "🇲🇦", "Tunisia": "🇹🇳", "Australia": "🇦🇺",
            "Bosnia and Herzegovina": "🇧🇦", "Croatia": "🇭🇷", "Paraguay": "🇵🇾", "South Korea": "🇰🇷",
            "Portugal": "🇵🇹", "Austria": "🇦🇹", "Curaçao": "🇨🇼", "Switzerland": "🇨🇭",
            "Ecuador": "🇪🇨", "Türkiye": "🇹🇷", "New Zealand": "🇳🇿", "Cape Verde": "🇨🇻"
        };

        const CONTACTS = {
            "Côte d'Ivoire": "https://t.me/Khant0079", "Egypt": "https://t.me/Bel_kyaw",
            "Senegal": "", "Brazil": "https://t.me/ChanAung1178",
            "South Africa": "https://t.me/aungnayzan", "Japan": "https://t.me/Nyan428925",
            "Colombia": "https://t.me/AHtikeZ", "Saudi Arabia": "https://t.me/lakham212",
            "England": "https://t.me/HmMmOnFiRe", "Canada": "https://t.me/AungZinPhyo1992",
            "United States": "https://t.me/ShadowFang191", "Iraq": "https://t.me/kharkhar1225",
            "Mexico": "https://t.me/lokidemon99", "Belgium": "https://t.me/Heinminmdy",
            "France": "https://t.me/nicorizer", "Ghana": "https://t.me/khantkyawthu_01",
            "Uruguay": "https://t.me/HeinHtet_Nai", "Morocco": "https://t.me/Myan_Khun",
            "Tunisia": "https://t.me/Ranger13102003", "Australia": "https://t.me/Aungpyinnyar",
            "Bosnia and Herzegovina": "https://t.me/SonyaMuller9", "Croatia": "https://t.me/nzp567",
            "Paraguay": "https://t.me/HmMmOnFiRe", "South Korea": "https://t.me/Hemaljr10",
            "Portugal": "https://t.me/Wallker29", "Austria": "https://t.me/oakjar",
            "Curaçao": "https://t.me/iz_szlai", "Switzerland": "https://t.me/ThuriMin2355",
            "Ecuador": "https://t.me/Nyanzayar", "Türkiye": "https://t.me/Ferdico99",
            "New Zealand": "https://t.me/mikeyjn", "Cape Verde": "https://t.me/Heropool"
        };

        const tournamentData = {
            "R32": [
                {t1: "Côte d'Ivoire", t2: "Egypt"}, {t1: "Senegal", t2: "Brazil"},
                {t1: "South Africa", t2: "Japan"}, {t1: "Colombia", t2: "Saudi Arabia"},
                {t1: "England", t2: "Canada"}, {t1: "United States", t2: "Iraq"},
                {t1: "Mexico", t2: "Belgium"}, {t1: "France", t2: "Ghana"},
                {t1: "Uruguay", t2: "Morocco"}, {t1: "Tunisia", t2: "Australia"},
                {t1: "Bosnia and Herzegovina", t2: "Croatia"}, {t1: "Paraguay", t2: "South Korea"},
                {t1: "Portugal", t2: "Austria"}, {t1: "Curaçao", t2: "Switzerland"},
                {t1: "Ecuador", t2: "Türkiye"}, {t1: "New Zealand", t2: "Cape Verde"}
            ],
            "R16": [], "QF": [], "SF": [], "Final": []
        };

        function showStage(stage, event) {
            const container = document.getElementById('tournament-content');
            container.innerHTML = '';
            
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }

            const matches = tournamentData[stage];
            if(!matches || matches.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 pt-10">ပွဲစဉ်များ မစတင်သေးပါ</p>';
                return;
            }

            matches.forEach((m) => {
                const matchCard = document.createElement('div');
                matchCard.className = 'match-card';
                
                // အိမ်ရှင်အသင်း - အလံ ရှေ့မှာ
                const createHomeTeamUI = (name) => {
                    const flag = TEAMS[name] || "";
                    return CONTACTS[name] ? `<a href="${CONTACTS[name]}" target="_blank" class="team-link"><span>${flag}</span> ${name}</a>` : `<span class="no-link"><span>${flag}</span> ${name}</span>`;
                };

                // အဝေးအသင်း - အလံ နောက်မှာ
                const createAwayTeamUI = (name) => {
                    const flag = TEAMS[name] || "";
                    return CONTACTS[name] ? `<a href="${CONTACTS[name]}" target="_blank" class="team-link">${name} <span>${flag}</span></a>` : `<span class="no-link">${name} <span>${flag}</span></span>`;
                };

                matchCard.innerHTML = `
                    <div class="flex-1 text-left truncate pr-2">${createHomeTeamUI(m.t1)}</div>
                    <div class="result-badge px-2">VS</div>
                    <div class="flex-1 text-right truncate pl-2 flex justify-end">${createAwayTeamUI(m.t2)}</div>
                `;
                container.appendChild(matchCard);
            });
        }
        
        showStage('R32', { currentTarget: document.querySelector('.nav-btn') });
    </script>
</body>
</html>
