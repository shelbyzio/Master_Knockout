<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master League S - 6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0c0e14; color: #ffffff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .match-card { background: #1a1c24; border-radius: 12px; padding: 16px 20px; border: 1px solid #2a2f3a; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .result-score { font-size: 0.85rem; font-weight: 800; color: #d4ff00; text-align: center; }
        .team-link { font-size: 0.9rem; font-weight: 600; color: #f1f5f9; text-decoration: none; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .team-link:hover { color: #d4ff00; }
        .no-link { font-size: 0.9rem; font-weight: 600; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
        .nav-btn { font-size: 0.75rem; font-weight: 700; padding: 8px 12px; border-radius: 6px; background: #2a2f3a; color: #ffffff; transition: 0.3s; cursor: pointer; border: none; }
        .nav-btn.active { background: #d4ff00; color: #0c0e14; }
    </style>
</head>
<body class="p-4 md:p-6">
    <div class="max-w-md mx-auto">
        <h1 class="text-xl font-bold text-white tracking-widest uppercase mb-6 text-center">Master League S - 6</h1>
        
        <div id="nav-container" class="flex flex-wrap gap-2 mb-8 justify-center">
            <button class="nav-btn" onclick="showStage('R32', event)">Round of 32</button>
            <button class="nav-btn" onclick="showStage('R16', event)">Round of 16</button>
            <button class="nav-btn" onclick="showStage('QF', event)">Quarter Final</button>
            <button class="nav-btn" onclick="showStage('SF', event)">Semi</button>
            <button class="nav-btn" onclick="showStage('Final', event)">Final</button>
        </div>

        <div id="tournament-content" class="space-y-3"></div>
    </div>

    <script>
        const TEAMS = {
            "Australia": "🇦🇺", "Belgium": "🇧🇪", "Cape Verde": "🇨🇻", "Canada": "🇨🇦", "Curaçao": "🇨🇼",
            "Colombia": "🇨🇴", "Ecuador": "🇪🇨", "DR Congo": "🇨🇩", "Haiti": "🇭🇹", "France": "🇫🇷",
            "Iran": "🇮🇷", "Iraq": "🇮🇶", "New Zealand": "🇳🇿", "Netherlands": "🇳🇱", "Norway": "🇳🇴",
            "Portugal": "🇵🇹", "Scotland": "🏴󠁧󠁢󠁳󠁣󠁴󠁿", "Saudi Arabia": "🇸🇦", "Spain": "🇪🇸",
            "South Africa": "🇿🇦", "Switzerland": "🇨🇭", "United States": "🇺🇸", "Côte d'Ivoire": "🇨🇮",
            "Uzbekistan": "🇺🇿", "Paraguay": "🇵🇾", "Bosnia": "🇧🇦", "Mexico": "🇲🇽", "Austria": "🇦🇹",
            "Senegal": "🇸🇳", "England": "🏴󠁧󠁢󠁥󠁮󠁧󠁿", "Ghana": "🇬🇭", "Jordan": "🇯🇴"
        };

        const CONTACTS = {
            "Australia": "https://t.me/KoKyaw_KYT", "Belgium": "https://t.me/Garniya", "Cape Verde": "https://t.me/yminchit69", "Canada": "https://t.me/zam57493", "Curaçao": "https://t.me/Badrul11", "Colombia": "", "Ecuador": "https://t.me/Wallker29", "DR Congo": "https://t.me/zeusace0", "Haiti": "https://t.me/Dijeaan", "France": "https://t.me/MRTONE3", "Iran": "https://t.me/heinkyawthuang", "Iraq": "https://t.me/Theinau", "New Zealand": "https://t.me/jthu23", "Netherlands": "https://t.me/Khualpu199", "Norway": "https://t.me/Orodevice", "Portugal": "https://t.me/MUCHExt", "Scotland": "https://t.me/ceeyg", "Saudi Arabia": "https://t.me/MCngakaung", "Spain": "https://t.me/Hein040", "South Africa": "https://t.me/paingqt", "Switzerland": "https://t.me/oki6k", "United States": "https://t.me/kyawlwintun17", "Côte d'Ivoire": "https://t.me/mrleon006", "Uzbekistan": "https://t.me/lord_voldemort101", "Paraguay": "https://t.me/ventus2940", "Bosnia": "https://t.me/MinThwe18", "Mexico": "https://t.me/Nyishein77", "Austria": "https://t.me/Khine_Lin_Htay", "Senegal": "https://t.me/Ricechat13579", "England": "", "Ghana": "https://t.me/Kyawthaik468", "Jordan": "https://t.me/BlackEaglessuper"
        };

        const tournamentData = {
            "R32": [
                {t1: "Australia", t2: "Cape Verde", score: "3-2"}, {t1: "Belgium", t2: "Canada", score: "4-2"},
                {t1: "Curaçao", t2: "Ecuador", score: "6-2"}, {t1: "Colombia", t2: "DR Congo", score: "0-5"},
                {t1: "Haiti", t2: "Iran", score: "8-6"}, {t1: "France", t2: "Iraq", score: "5-3"},
                {t1: "New Zealand", t2: "Norway", score: "5-1"}, {t1: "Netherlands", t2: "Portugal", score: "2-1"},
                {t1: "Scotland", t2: "Spain", score: "1-2"}, {t1: "Saudi Arabia", t2: "South Africa", score: "3-5"},
                {t1: "Switzerland", t2: "Côte d'Ivoire", score: "TBD"}, {t1: "United States", t2: "Uzbekistan", score: "0-2"},
                {t1: "Paraguay", t2: "Bosnia", score: "3-0"}, {t1: "Mexico", t2: "Austria", score: "1-2"},
                {t1: "Senegal", t2: "England", score: "1-2"}, {t1: "Ghana", t2: "Jordan", score: "8(p)-7"}
            ],
            "R16": [
                {t1: "Australia", t2: "Belgium", score: "5-1"}, {t1: "Curaçao", t2: "DR Congo", score: "5-4"},
                {t1: "Haiti", t2: "France", score: "4-1"}, {t1: "New Zealand", t2: "Netherlands", score: "9-3"},
                {t1: "Spain", t2: "South Africa", score: "2-3"}, {t1: "Switzerland/CIV", t2: "Uzbekistan", score: "2-5"},
                {t1: "Paraguay", t2: "Austria", score: "6(p)-4"}, {t1: "England", t2: "Ghana", score: "4-2"}
            ],
            "QF": [
                {t1: "Australia", t2: "Curaçao", score: "0-10"},
                {t1: "Haiti", t2: "New Zealand", score: "2-7"},
                {t1: "South Africa", t2: "Uzbekistan", score: "2-3"},
                {t1: "Paraguay", t2: "England", score: "3-2"}
            ],
            "SF": [
                {t1: "Curaçao", t2: "New Zealand"},
                {t1: "Uzbekistan", t2: "Paraguay"}
            ],
            "Final": []
        };

        function showStage(stage, event) {
            const container = document.getElementById('tournament-content');
            container.innerHTML = '';
            
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            } else {
                document.querySelector('[onclick*="'+stage+'"]').classList.add('active');
            }

            const matches = tournamentData[stage];
            if(!matches || matches.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 pt-10">ပွဲစဉ်များ မစတင်သေးပါ</p>';
                return;
            }

            matches.forEach((m) => {
                const matchCard = document.createElement('div');
                matchCard.className = 'match-card';
                
                const createTeamUI = (name, isLeft) => {
                    const flag = TEAMS[name] || "";
                    const contact = CONTACTS[name];
                    return contact ? 
                        `<a href="${contact}" target="_blank" class="team-link">${isLeft ? `<span>${flag}</span> ${name}` : `${name} <span>${flag}</span>`}</a>` :
                        `<span class="no-link">${isLeft ? `<span>${flag}</span> ${name}` : `${name} <span>${flag}</span>`}</span>`;
                };

                matchCard.innerHTML = `
                    <div class="flex-1 truncate ${m.score ? 'text-left' : ''}">${createTeamUI(m.t1, true)}</div>
                    <div class="result-score px-3">${m.score || "VS"}</div>
                    <div class="flex-1 truncate text-right flex justify-end">${createTeamUI(m.t2, false)}</div>
                `;
                container.appendChild(matchCard);
            });
        }
        
        // Initial load
        showStage('QF', { currentTarget: document.querySelector('[onclick*="QF"]') });
    </script>
</body>
</html>
